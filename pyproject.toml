[project]
name = "data-scraper-sistema"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbfread>=2.0.7",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymysql>=1.2.0",
    "pyright>=1.1.414",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "pywinauto>=0.6.9",
    "sqlalchemy>=2.0.52",
    "strenum>=0.4.15",
    "swagger-ui>=0.1.2",
    "uvicorn[standard]>=0.52.4",
    "xlrd>=2.0.2",
]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/ingestion", "src/api", "src/db", "src/repositories"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM",
    "PD",    # pandas-vet
    "NPY",   # numpy (pandas lo usa por debajo)
    "PERF",  # anti-patrones de rendimiento (loops lentos, etc.)
]
ignore = [
    "E501",
    "PD901",  # se queja de variables llamadas `df`
    "PD011",  # marca cualquier `.values`, aunque sea un dict
]
